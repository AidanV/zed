[package]
name = "ted"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ted.rs"
doctest = false

[[bin]]
name = "ted"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
assets.workspace = true
base64.workspace = true
buffer_diff.workspace = true
clap.workspace = true
client.workspace = true
collections.workspace = true
command_palette.workspace = true
command_palette_hooks.workspace = true
crossterm.workspace = true
db.workspace = true
editor.workspace = true
file_finder.workspace = true
fs.workspace = true
futures.workspace = true
go_to_line.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
language.workspace = true
# `load-grammars` is not a default feature; without it no tree-sitter grammar is
# registered and every chunk comes back unhighlighted.
languages = { workspace = true, features = ["load-grammars"] }
log.workspace = true
menu.workspace = true
multi_buffer.workspace = true
node_runtime.workspace = true
parking_lot.workspace = true
paths.workspace = true
project.workspace = true
ratatui.workspace = true
raw-window-handle.workspace = true
release_channel.workspace = true
reqwest_client.workspace = true
search.workspace = true
semver.workspace = true
session.workspace = true
settings.workspace = true
theme.workspace = true
theme_settings.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
util.workspace = true
uuid.workspace = true
vim.workspace = true
watch.workspace = true
workspace.workspace = true
zed_actions.workspace = true
zlog.workspace = true

[target.'cfg(unix)'.dependencies]
# Suspending ignores the terminal-generated signals for the child's lifetime and
# restores them in the child before `exec` (SPEC §7.1).
libc.workspace = true

[dev-dependencies]
editor = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
portable-pty.workspace = true
project = { workspace = true, features = ["test-support"] }
# Not used directly. `editor/test-support` turns on `remote/test-support`, which
# adds a `RemoteConnectionOptions` variant that `remote_connection` only matches
# on under its own `test-support`, so the two must be enabled together.
remote_connection = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
